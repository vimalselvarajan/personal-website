name: Retry transient Pages deployment

on:
  workflow_run:
    workflows: ["Quality and GitHub Pages"]
    types: [completed]

# This workflow does not check out untrusted code. It needs this permission only
# to re-run the failed deployment job from the completed workflow run.
permissions:
  actions: write

jobs:
  retry-deployment:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for the Pages service to recover
        run: sleep 90

      - name: Re-run the failed Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          deploy_job_id="$(
            gh api --paginate \
              "/repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=latest" \
              --jq '.jobs[] | select(.name == "deploy" and .conclusion == "failure") | .id' \
              | head -n 1
          )"

          if [[ -z "${deploy_job_id}" ]]; then
            echo "No failed Pages deployment job found; nothing to retry."
            exit 0
          fi

          echo "Re-running failed Pages deployment job ${deploy_job_id}."
          gh api --method POST \
            "/repos/${GH_REPO}/actions/jobs/${deploy_job_id}/rerun"
