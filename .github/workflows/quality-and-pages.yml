name: Quality and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /Personal-Website
      PORTFOLIO_LIGHTHOUSE_DIR: .lighthouseci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'content/**', '*.ts', '*.mjs') }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Static and unit validation
        run: npm run validate

      - name: Browser, accessibility, and visual validation
        run: npm run test:e2e

      - name: Lighthouse budgets
        run: npm run test:lighthouse

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout smoke-test script
        uses: actions/checkout@v4

      - name: Verify deployed routes and assets
        run: node scripts/smoke-deployment.mjs
        env:
          PORTFOLIO_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
